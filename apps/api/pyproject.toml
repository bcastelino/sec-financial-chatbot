[project]
name = "filing-room-api"
version = "0.1.0"
description = "SEC ingestion and grounded research API for Filing Room"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3==1.39.14",
  "beautifulsoup4==4.13.4",
  "edgartools>=5.0.0,<6.0.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "orjson==3.11.1",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "sse-starlette==2.4.1",
  "uvicorn[standard]==0.35.0"
]

[dependency-groups]
dev = [
  "mypy==1.17.0",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "respx==0.22.0",
  "ruff==0.12.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["filing_room"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["B008", "E501", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "edgar", "edgar.*"]
ignore_missing_imports = true
